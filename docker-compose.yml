services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${TALARIA_POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${TALARIA_POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: 256
    environment:
      POSTGRES_DB: talaria
      POSTGRES_USER: talaria
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaria -d talaria"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  talaria-api:
    build: .
    image: talaria:0.1.0
    restart: unless-stopped
    mem_limit: ${TALARIA_API_MEMORY_LIMIT:-1g}
    cpus: ${TALARIA_API_CPU_LIMIT:-1.0}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TALARIA_DATABASE_URL: postgresql://talaria@postgres:5432/talaria?sslmode=disable
      TALARIA_DATABASE_TRUSTED_HOSTS: postgres
      FORWARDED_ALLOW_IPS: ${TALARIA_FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
      TALARIA_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TALARIA_ALLOWED_REPOSITORY_ROOTS: /repositories
      TALARIA_JWT_SECRET_FILE: /run/secrets/jwt_secret
      TALARIA_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook_secret
      TALARIA_AI_ENABLED: ${TALARIA_AI_ENABLED:-false}
      TALARIA_AI_SEND_SOURCE: ${TALARIA_AI_SEND_SOURCE:-false}
      TALARIA_AI_TIMEOUT_SECONDS: ${TALARIA_AI_TIMEOUT_SECONDS:-20}
      TALARIA_METRICS_TOKEN: ${TALARIA_METRICS_TOKEN:-}
      TALARIA_LLM_BASE_URL: ${TALARIA_LLM_BASE_URL:-}
      TALARIA_LLM_MODEL: ${TALARIA_LLM_MODEL:-}
      TALARIA_LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets:
      - postgres_password
      - jwt_secret
      - bootstrap_token
      - github_app_private_key
      - github_webhook_secret
      - llm_api_key
    volumes:
      - ${TALARIA_HOST_REPOSITORY_ROOT:-.}:/repositories:ro
      - ${TALARIA_BACKUP_DIR:-./backups}:/backups:rw
    networks:
      - database
      - edge
      - outbound
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  talaria-dashboard:
    image: talaria:0.1.0
    restart: unless-stopped
    mem_limit: ${TALARIA_DASHBOARD_MEMORY_LIMIT:-512m}
    cpus: ${TALARIA_DASHBOARD_CPU_LIMIT:-0.50}
    pids_limit: 128
    depends_on:
      talaria-api:
        condition: service_healthy
    command:
      - streamlit
      - run
      - talaria/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      TALARIA_API_URL: http://talaria-api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:

networks:
  database:
    internal: true
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${TALARIA_EDGE_SUBNET:-172.30.20.0/24}
  outbound:

secrets:
  postgres_password:
    file: ${TALARIA_POSTGRES_PASSWORD_FILE:?Set a local PostgreSQL password file}
  jwt_secret:
    file: ${TALARIA_JWT_SECRET_FILE:?Set a local JWT signing secret file}
  bootstrap_token:
    file: ${TALARIA_BOOTSTRAP_TOKEN_FILE:-./secrets/bootstrap-token.example}
  github_app_private_key:
    file: ${GITHUB_APP_PRIVATE_KEY_FILE:-./secrets/github-app.pem.example}
  github_webhook_secret:
    file: ${GITHUB_WEBHOOK_SECRET_FILE:-./secrets/github-webhook-secret.example}
  llm_api_key:
    file: ${TALARIA_LLM_API_KEY_FILE:-./secrets/llm-api-key.example}
