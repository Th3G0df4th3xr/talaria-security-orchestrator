[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "talaria-security-orchestrator"
version = "0.1.0"
description = "Local-first application security scanning and finding orchestration MVP"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Talaria Contributors"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "GitPython>=3.1",
    "argon2-cffi>=23.1",
    "PyJWT[crypto]>=2.8",
    "psycopg[binary]>=3.2,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "build>=1.2"]
dashboard = ["streamlit>=1.32", "plotly>=5.18", "requests>=2.31"]

[project.scripts]
talaria = "talaria.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["talaria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: isolated unit tests",
    "integration: tests spanning multiple application components",
    "security: security-control regression tests",
    "adversarial: hostile-input and bypass tests",
    "concurrency: concurrent operation tests",
    "postgres: requires a disposable PostgreSQL database",
    "docker: requires a Docker runtime",
    "kubernetes: requires a Kubernetes cluster",
    "external: requires an external provider or credential",
    "acceptance: end-to-end or release acceptance tests",
    "database: database and migration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]


[tool.hatch.build]
exclude = [
    "**/*.pre-*",
    "**/*.backup",
    "**/*.bak",
    "**/*.phase1-backup",
    ".talaria/**",
    "reports/**",
    ".venv/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "dist/**",
    "build/**",
]
