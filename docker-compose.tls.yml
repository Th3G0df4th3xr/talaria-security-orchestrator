services:
  talaria-api:
    environment:
      FORWARDED_ALLOW_IPS: ${TALARIA_CADDY_IP:-172.30.20.2}

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      talaria-api:
        condition: service_healthy
      talaria-dashboard:
        condition: service_healthy
    environment:
      TALARIA_DOMAIN: ${TALARIA_DOMAIN:?Set TALARIA_DOMAIN to a DNS name pointing at this host}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${TALARIA_CADDY_IP:-172.30.20.2}
      outbound: {}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128

volumes:
  caddy-data:
  caddy-config:
